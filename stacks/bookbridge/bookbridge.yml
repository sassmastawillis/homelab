# bookbridge
# cross-platform reading and listening synchronization
services:
  abs-kosync:
    container_name: bookbridge
    image: ghcr.io/cporcellijr/bookbridge:latest
    restart: unless-stopped
    ports:
      - "5757:5757"
      # - "5758:5758"  # Optional: expose the sync-only port when using KOSYNC_PORT=5758
    environment:
      - TZ=America/New_York
      - LOG_LEVEL=INFO
      # - KOSYNC_PORT=5758  # Optional: enable split-port mode
      # Configure ABS, KOSync, Grimmory, BookOrbit, CWA, Storyteller, and other services in the Web UI.
    volumes:
      - /appdata/bookbridge:/data
      - /srv/mergerfs/Data/yoho/Books/eBooks:/books
      - /srv/mergerfs/Data/yoho/Books/Readalouds:/readalongs  # Optional: local Storyteller fallback/download access
      - /srv/mergerfs/Data/yoho/Books/storyteller:/storyteller    # Optional: Storyteller transcript ingest
