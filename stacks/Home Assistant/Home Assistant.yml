# Home Assistant
# homeassistant, esphome
services:
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    network_mode: host
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/New_York
    volumes:
      - /config/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    #ports:
