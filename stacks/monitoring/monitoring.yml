# monitoring
# grafana dashboard using victoriametrics, vmagent, node-exporter, and cadvisor
services:

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
    volumes:
      - /appdata/victoriametrics:/storage
    ports:
      - 8428:8428
    restart: unless-stopped

  vmagent:
    image: victoriametrics/vmagent:latest
    container_name: vmagent
    command:
      - -promscrape.config=/etc/prometheus/prometheus.yml
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
      - -promscrape.maxScrapeSize=64MB
      # - -memory.allowedPercent=20
    volumes:
      - /config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - victoriametrics
      - cadvisor
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --disable_metrics=percpu,process,sched,tcp,udp,disk,diskIO,referenced_memory
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - 8083:8080
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - /appdata/grafana:/var/lib/grafana
    ports:
      - 3001:3000
    restart: unless-stopped
