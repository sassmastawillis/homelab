# Homepage
# Homepage and Homarr
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.0.225:3333,localhost:3333,gethomepage.dev # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
