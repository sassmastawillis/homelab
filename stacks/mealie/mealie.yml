# mealie
# Recipe manager
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    networks:
      - default
      - swag
    restart: unless-stopped
    ports:
      - "9090:9000"
    environment:
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: America/New_York
      BASE_URL: https://mealie.example.com
      SMTP_HOST: mail.smtp2go.com
      SMTP_PORT: 587
      SMTP_AUTH_STRATEGY: TLS
      SMTP_FROM_EMAIL: mealie@example.com
      SMTP_FROM_NAME: Mealie
      SMTP_USER: rossyserver-mealie
      SMTP_PASSWORD: ${SMTP_PASSWORD:?smtp password required}
    volumes:
      - /appdata/mealie:/app/data

networks:
  swag:
    external: true
    name: swag
