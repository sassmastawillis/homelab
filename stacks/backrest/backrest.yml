# backrest
# web UI wrapper for restic backup program
services:
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    volumes:
      - /appdata/backrest/data:/data
      - /config/backrest:/config
      - /appdata/backrest/cache:/cache

      # Sources to back up
      - /appdata:/backup/appdata:ro
      - /config:/backup/config:ro
      - /srv/mergerfs/Data:/backup/Data:ro

      # Local restic repo
      - /srv/mergerfs/Data/backups/backrest:/repos

      # Only needed if you want hooks to stop/start containers during backup
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - BACKREST_DATA=/data # path for backrest data. restic binary and the database are placed here.
      - BACKREST_CONFIG=/config/config.json # path for the backrest config file.
      - XDG_CACHE_HOME=/cache # path for the restic cache which greatly improves performance.
      - TZ=America/New_York
    restart: unless-stopped
    ports:
      - 9898:9898
